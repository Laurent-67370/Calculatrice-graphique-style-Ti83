<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculatrice TI-83 Plus</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator">
            <!-- En-tête TI-83 Plus -->
            <div class="calculator-header">
                <div class="brand">Texas Instruments</div>
                <div class="model">TI-83 Plus</div>
            </div>

            <!-- Écran LCD -->
            <div class="screen-container">
                <div class="screen-indicators">
                    <span class="indicator" id="rad-deg">RAD</span>
                    <span class="indicator" id="stat">STAT</span>
                    <span class="indicator" id="graph">GRAPH</span>
                </div>
                <div class="screen">
                    <div class="screen-history" id="history"></div>
                    <canvas id="graphCanvas" width="380" height="200"></canvas>
                    <div class="screen-input" id="input">0</div>
                </div>
            </div>

            <!-- Clavier -->
            <div class="keyboard">
                <!-- Ligne 1: Fonctions spéciales -->
                <div class="key-row">
                    <button class="key key-blue" data-action="y-vars">
                        <span class="key-secondary">Y-VARS</span>
                        Y=
                    </button>
                    <button class="key key-blue" data-action="window">
                        <span class="key-secondary">TBLSET</span>
                        WINDOW
                    </button>
                    <button class="key key-blue" data-action="zoom">
                        <span class="key-secondary">FORMAT</span>
                        ZOOM
                    </button>
                    <button class="key key-blue" data-action="trace">
                        <span class="key-secondary">CALC</span>
                        TRACE
                    </button>
                    <button class="key key-blue" data-action="graph">
                        <span class="key-secondary">TABLE</span>
                        GRAPH
                    </button>
                </div>

                <!-- Ligne 2: 2ND et MODE -->
                <div class="key-row">
                    <button class="key key-yellow" data-action="2nd">
                        2nd
                    </button>
                    <button class="key key-alpha" data-action="mode">
                        <span class="key-secondary yellow">QUIT</span>
                        MODE
                    </button>
                    <button class="key key-alpha" data-action="del">
                        <span class="key-secondary yellow">INS</span>
                        DEL
                    </button>
                    <button class="key" data-action="left">
                        <span class="key-secondary"></span>
                        ◄
                    </button>
                    <button class="key" data-action="right">
                        <span class="key-secondary"></span>
                        ►
                    </button>
                </div>

                <!-- Ligne 3: ALPHA et fonctions -->
                <div class="key-row">
                    <button class="key key-green" data-action="alpha">
                        ALPHA
                    </button>
                    <button class="key" data-action="x-var">
                        <span class="key-secondary yellow">LINK</span>
                        <span class="key-green">A</span>
                        X,T,θ,n
                    </button>
                    <button class="key" data-action="stat">
                        <span class="key-secondary yellow">LIST</span>
                        <span class="key-green">B</span>
                        STAT
                    </button>
                    <button class="key" data-action="up">
                        <span class="key-secondary"></span>
                        ▲
                    </button>
                    <button class="key" data-action="down">
                        <span class="key-secondary"></span>
                        ▼
                    </button>
                </div>

                <!-- Ligne 4: MATH et fonctions -->
                <div class="key-row">
                    <button class="key" data-action="math">
                        <span class="key-secondary yellow">TEST</span>
                        <span class="key-green">C</span>
                        MATH
                    </button>
                    <button class="key" data-action="apps">
                        <span class="key-secondary yellow">ANGLE</span>
                        <span class="key-green">D</span>
                        APPS
                    </button>
                    <button class="key" data-action="prgm">
                        <span class="key-secondary yellow">DRAW</span>
                        <span class="key-green">E</span>
                        PRGM
                    </button>
                    <button class="key" data-action="vars">
                        <span class="key-secondary yellow">DISTR</span>
                        VARS
                    </button>
                    <button class="key" data-action="clear">
                        <span class="key-secondary"></span>
                        CLEAR
                    </button>
                </div>

                <!-- Ligne 5: Fonctions inverses -->
                <div class="key-row">
                    <button class="key" data-action="x-inverse">
                        <span class="key-secondary yellow">MATRIX</span>
                        <span class="key-green">F</span>
                        x⁻¹
                    </button>
                    <button class="key" data-action="sin">
                        <span class="key-secondary yellow">SIN⁻¹</span>
                        <span class="key-green">G</span>
                        SIN
                    </button>
                    <button class="key" data-action="cos">
                        <span class="key-secondary yellow">COS⁻¹</span>
                        <span class="key-green">H</span>
                        COS
                    </button>
                    <button class="key" data-action="tan">
                        <span class="key-secondary yellow">TAN⁻¹</span>
                        <span class="key-green">I</span>
                        TAN
                    </button>
                    <button class="key" data-action="power">
                        <span class="key-secondary yellow">π</span>
                        <span class="key-green">J</span>
                        ^
                    </button>
                </div>

                <!-- Ligne 6: Fonctions avancées -->
                <div class="key-row">
                    <button class="key" data-action="x-squared">
                        <span class="key-secondary yellow">√</span>
                        <span class="key-green">K</span>
                        x²
                    </button>
                    <button class="key" data-action="comma">
                        <span class="key-secondary yellow">EE</span>
                        <span class="key-green">L</span>
                        ,
                    </button>
                    <button class="key" data-action="lparen">
                        <span class="key-secondary yellow">{</span>
                        <span class="key-green">M</span>
                        (
                    </button>
                    <button class="key" data-action="rparen">
                        <span class="key-secondary yellow">}</span>
                        <span class="key-green">N</span>
                        )
                    </button>
                    <button class="key key-blue" data-action="divide">
                        <span class="key-secondary yellow">e</span>
                        <span class="key-green">O</span>
                        ÷
                    </button>
                </div>

                <!-- Ligne 7: Fonctions log -->
                <div class="key-row">
                    <button class="key" data-action="log">
                        <span class="key-secondary yellow">10^x</span>
                        <span class="key-green">P</span>
                        LOG
                    </button>
                    <button class="key key-white" data-action="7">
                        <span class="key-secondary yellow">u</span>
                        <span class="key-green">Q</span>
                        7
                    </button>
                    <button class="key key-white" data-action="8">
                        <span class="key-secondary yellow">v</span>
                        <span class="key-green">R</span>
                        8
                    </button>
                    <button class="key key-white" data-action="9">
                        <span class="key-secondary yellow">w</span>
                        <span class="key-green">S</span>
                        9
                    </button>
                    <button class="key key-blue" data-action="multiply">
                        <span class="key-secondary yellow">[</span>
                        <span class="key-green">T</span>
                        ×
                    </button>
                </div>

                <!-- Ligne 8: Fonctions ln -->
                <div class="key-row">
                    <button class="key" data-action="ln">
                        <span class="key-secondary yellow">e^x</span>
                        <span class="key-green">U</span>
                        LN
                    </button>
                    <button class="key key-white" data-action="4">
                        <span class="key-secondary yellow">L4</span>
                        <span class="key-green">V</span>
                        4
                    </button>
                    <button class="key key-white" data-action="5">
                        <span class="key-secondary yellow">L5</span>
                        <span class="key-green">W</span>
                        5
                    </button>
                    <button class="key key-white" data-action="6">
                        <span class="key-secondary yellow">L6</span>
                        <span class="key-green">X</span>
                        6
                    </button>
                    <button class="key key-blue" data-action="subtract">
                        <span class="key-secondary yellow">]</span>
                        <span class="key-green">Y</span>
                        −
                    </button>
                </div>

                <!-- Ligne 9: STO et chiffres -->
                <div class="key-row">
                    <button class="key" data-action="sto">
                        <span class="key-secondary yellow">RCL</span>
                        <span class="key-green">Z</span>
                        STO►
                    </button>
                    <button class="key key-white" data-action="1">
                        <span class="key-secondary yellow">L1</span>
                        <span class="key-green">θ</span>
                        1
                    </button>
                    <button class="key key-white" data-action="2">
                        <span class="key-secondary yellow">L2</span>
                        <span class="key-green">i</span>
                        2
                    </button>
                    <button class="key key-white" data-action="3">
                        <span class="key-secondary yellow">L3</span>
                        3
                    </button>
                    <button class="key key-blue" data-action="add">
                        <span class="key-secondary yellow">MEM</span>
                        +
                    </button>
                </div>

                <!-- Ligne 10: ON et derniers chiffres -->
                <div class="key-row">
                    <button class="key" data-action="on">
                        <span class="key-secondary yellow">OFF</span>
                        ON
                    </button>
                    <button class="key key-white" data-action="0">
                        <span class="key-secondary yellow">CATALOG</span>
                        0
                    </button>
                    <button class="key key-white" data-action="decimal">
                        <span class="key-secondary yellow">:</span>
                        .
                    </button>
                    <button class="key" data-action="negative">
                        <span class="key-secondary yellow">ANS</span>
                        (−)
                    </button>
                    <button class="key key-blue key-enter" data-action="enter">
                        ENTER
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts principaux -->
    <script src="calculator.js"></script>
    <script src="graphing.js"></script>

    <!-- Modules avancés -->
    <script src="statistics.js"></script>
    <script src="math-functions.js"></script>
    <script src="editors.js"></script>
    <script src="menu-system.js"></script>
    <script src="integration.js"></script>
</body>
</html>
